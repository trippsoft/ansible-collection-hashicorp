---
- name: Gather OS facts
  when:
    - ansible_facts.distribution is not defined or
      ansible_facts.distribution_major_version is not defined or
      ansible_facts.distribution_release is not defined or
      ansible_facts.distribution_version is not defined or
      ansible_facts.os_family is not defined
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - distribution
      - distribution_major_version
      - distribution_release
      - os_family

- name: Include OS specific variables
  ansible.builtin.include_vars: "{{ _file }}"
  vars:
    _file: "{{ lookup('first_found', _params) }}"
    _params:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_release | default('') }}.yml"
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
        - fallback.yml
      paths:
        - "{{ role_path }}/vars"

- name: Validate OS is supported
  ansible.builtin.assert:
    that:
      - _hashicorp_os_is_supported
    fail_msg: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} is not supported."
    success_msg: >-
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} is from a supported OS family.

- name: Indicate OS is tested
  when:
    - _hashicorp_os_is_tested
  ansible.builtin.debug:
    msg: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} has been tested with this role."

- name: Warn if OS is not tested
  when:
    - not _hashicorp_os_is_tested
  ansible.builtin.debug:
    msg: "WARNING: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} is not tested."
  changed_when: true
